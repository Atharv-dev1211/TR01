name: Node Application Build & Test

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  node_build_test:
    name: Node Application Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Node tests
        env:
          DB_PATH: ${{ runner.temp }}/queuecraft-test.db
        run: npm test

      - name: Build Node Application
        run: npm run build